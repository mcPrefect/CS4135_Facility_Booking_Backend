# version: "3.9"

# Shared network
networks:
  plassey-net:
    driver: bridge

# Named volumes
volumes:
  postgres-data:
  rabbitmq-data:

services:

  # Infrastructure

  postgres:
    image: postgres:15-alpine
    container_name: plassey-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - plassey-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: plassey-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - plassey-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Cloud infrastructure

  config-server:
    build: ./config-server
    container_name: plassey-config
    ports:
      - "8888:8888"
    networks:
      - plassey-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  eureka-server:
    build: ./eureka-server
    container_name: plassey-eureka
    ports:
      - "8761:8761"
    environment:
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
    networks:
      - plassey-net
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Microservices

  user-service:
    build: ./user-service
    container_name: plassey-user
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: my-super-secret-key-which-is-long-enough-123456
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - plassey-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  facility-service:
    build: ./facility-service
    container_name: plassey-facility
    ports:
      - "8082:8082"
    environment:
      JWT_SECRET: my-super-secret-key-which-is-long-enough-123456
      APP_JWT_SECRET: my-super-secret-key-which-is-long-enough-123456
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/facility_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      DB_URL: jdbc:postgresql://postgres:5432/facility_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_DRIVER: org.postgresql.Driver
      DB_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - plassey-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  booking-service:
    build: ./booking-service
    container_name: plassey-booking
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: my-super-secret-key-which-is-long-enough-123456
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/booking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - plassey-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  approval-service:
    build: ./approval-service
    container_name: plassey-approval
    ports:
      - "8084:8084"
    environment:
      JWT_SECRET: my-super-secret-key-which-is-long-enough-123456
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/approval_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - plassey-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    container_name: plassey-notification
    ports:
      - "8085:8085"
    environment:
      JWT_SECRET: my-super-secret-key-which-is-long-enough-123456
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      MAIL_USERNAME: ${MAIL_USERNAME:-your_mailtrap_user}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-your_mailtrap_pass}
    networks:
      - plassey-net
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  nlp-service:
    build: ./nlp-service
    container_name: plassey-nlp
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nlp_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      EUREKA_URL: http://eureka-server:8761/eureka
      FACILITY_SERVICE_URL: http://plassey-facility:8082
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks:
      - plassey-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: plassey-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: my-super-secret-key-which-is-long-enough-123456
      USER_SERVICE_URI: http://user-service:8081
      FACILITY_SERVICE_URI: http://facility-service:8082
      BOOKING_SERVICE_URI: http://booking-service:8083
      APPROVAL_SERVICE_URI: http://approval-service:8084
      NOTIFICATION_SERVICE_URI: http://notification-service:8085
      NLP_SERVICE_URI: http://nlp-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    networks:
      - plassey-net
    depends_on:
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_started
      facility-service:
        condition: service_started
      booking-service:
        condition: service_started
      notification-service:
        condition: service_started

